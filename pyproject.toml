[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptouch-ui"
version = "0.1.0"
description = "A desktop label editor for the Brother PT-2430PC on Linux"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "qrcode>=7.4", "python-barcode>=0.15"]

[project.gui-scripts]
ptouch-ui = "ptouch_ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
