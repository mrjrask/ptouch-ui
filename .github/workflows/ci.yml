name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions and test the installed wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python -m pip install dist/*.whl
          python -m pip check
          ptouch-ui --help
          ptouch-ui --version
          python -m ptouch_ui --version
      - name: Check formatting and lint
        if: matrix.python == '3.12'
        run: |
          python -m pip install 'ruff>=0.9,<1'
          ruff check .
          ruff format --check .
      - name: Run model, raster, and printer tests
        if: matrix.python == '3.10'
        run: python -m unittest discover -s tests -v
      - name: Run tests with the desktop display
        if: matrix.python == '3.12'
        run: |
          if ! command -v xvfb-run >/dev/null || ! command -v xauth >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends xvfb xauth
          fi
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Upload distribution artifacts
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  installer:
    name: Installer on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            runner: ubuntu-24.04
          # Raspberry Pi OS is Debian on arm64.
          - name: Debian 12 arm64
            runner: ubuntu-24.04-arm
            image: debian:bookworm
          - name: Debian 13 arm64
            runner: ubuntu-24.04-arm
            image: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - name: Install, reinstall, and uninstall the desktop app
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          if [ -n "$IMAGE" ]; then
            docker run --rm -v "$PWD:/src:ro" "$IMAGE" sh /src/.github/scripts/installer-test.sh --container
          else
            sh .github/scripts/installer-test.sh
          fi
